name: Control images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: control-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: control/go.mod
          cache-dependency-path: control/go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  detect-changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      hub_image_changed: ${{ steps.filter.outputs.hub_image_changed }}
      hostd_image_changed: ${{ steps.filter.outputs.hostd_image_changed }}
      hub_deploy_changed: ${{ steps.filter.outputs.hub_deploy_changed }}
      hostd_deploy_changed: ${{ steps.filter.outputs.hostd_deploy_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          hub_image_changed=false
          hostd_image_changed=false
          hub_deploy_changed=false
          hostd_deploy_changed=false

          set_all_changed() {
            hub_image_changed=true
            hostd_image_changed=true
            hub_deploy_changed=true
            hostd_deploy_changed=true
          }

          mark_path() {
            case "$1" in
              .github/workflows/control-images.yml)
                set_all_changed
                ;;
              control/go.mod|control/go.sum)
                hub_image_changed=true
                hostd_image_changed=true
                ;;
              control/cmd/tethon-hub/*|control/internal/hub/*)
                hub_image_changed=true
                ;;
              control/cmd/tethon-hostd/*|control/internal/server/*|control/internal/sessionlog/*|control/internal/worktree/*|control/internal/repo/*)
                hostd_image_changed=true
                ;;
              control/internal/protocol/*|control/internal/reverse/*|control/internal/agent/*|control/internal/resource/*)
                hub_image_changed=true
                hostd_image_changed=true
                ;;
              deploy/hub/Dockerfile)
                hub_image_changed=true
                ;;
              deploy/hostd/Dockerfile)
                hostd_image_changed=true
                ;;
              deploy/hub/docker-compose.yml)
                hub_deploy_changed=true
                ;;
              deploy/hostd/docker-compose.yml)
                hostd_deploy_changed=true
                ;;
            esac
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            set_all_changed
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi

            if [[ "$base" =~ ^0+$ ]]; then
              set_all_changed
            else
              git diff --name-only "$base" "$head" > changed-files.txt
              while IFS= read -r changed_path; do
                mark_path "$changed_path"
              done < changed-files.txt
            fi
          fi

          echo "hub_image_changed=$hub_image_changed" >> "$GITHUB_OUTPUT"
          echo "hostd_image_changed=$hostd_image_changed" >> "$GITHUB_OUTPUT"
          echo "hub_deploy_changed=$hub_deploy_changed" >> "$GITHUB_OUTPUT"
          echo "hostd_deploy_changed=$hostd_deploy_changed" >> "$GITHUB_OUTPUT"

          {
            echo "### Change detection"
            echo "- hub image: $hub_image_changed"
            echo "- hostd image: $hostd_image_changed"
            echo "- hub deploy: $hub_deploy_changed"
            echo "- hostd deploy: $hostd_deploy_changed"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-hub-image:
    name: Build and publish hub image
    runs-on: ubuntu-latest
    needs: [go-checks, detect-changes]
    if: ${{ github.event_name != 'pull_request' && needs.detect-changes.outputs.hub_image_changed == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compute image names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::12}"
          echo "HUB_IMAGE=${REGISTRY}/${owner}/tethon-hub" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/hub/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE }}:main
            ${{ env.HUB_IMAGE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=tethon-hub
          cache-to: type=gha,mode=max,scope=tethon-hub

  publish-hostd-image:
    name: Build and publish hostd image
    runs-on: ubuntu-latest
    needs: [go-checks, detect-changes]
    if: ${{ github.event_name != 'pull_request' && needs.detect-changes.outputs.hostd_image_changed == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compute image names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::12}"
          echo "HOSTD_IMAGE=${REGISTRY}/${owner}/tethon-hostd" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push hostd image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/hostd/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.HOSTD_IMAGE }}:main
            ${{ env.HOSTD_IMAGE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=tethon-hostd
          cache-to: type=gha,mode=max,scope=tethon-hostd

  deploy-hub:
    name: Trigger hub redeploy
    runs-on: ubuntu-latest
    needs: [go-checks, detect-changes, publish-hub-image]
    if: ${{ always() && github.event_name != 'pull_request' && needs.go-checks.result == 'success' && needs.detect-changes.result == 'success' && (needs.detect-changes.outputs.hub_image_changed == 'true' || needs.detect-changes.outputs.hub_deploy_changed == 'true') && (needs.publish-hub-image.result == 'success' || needs.publish-hub-image.result == 'skipped') }}
    steps:
      - name: Trigger hub redeploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_BASE_URL: ${{ vars.DOKPLOY_BASE_URL }}
          DOKPLOY_HUB_COMPOSE_ID: ${{ vars.DOKPLOY_HUB_COMPOSE_ID }}
        run: |
          missing=0
          if [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_BASE_URL" ] || [ -z "$DOKPLOY_HUB_COMPOSE_ID" ]; then
            [ -n "$DOKPLOY_API_KEY" ] || { echo "::error::DOKPLOY_API_KEY secret is missing."; missing=1; }
            [ -n "$DOKPLOY_BASE_URL" ] || { echo "::error::DOKPLOY_BASE_URL repository variable is missing."; missing=1; }
            [ -n "$DOKPLOY_HUB_COMPOSE_ID" ] || { echo "::error::DOKPLOY_HUB_COMPOSE_ID repository variable is missing."; missing=1; }
            exit "$missing"
          fi
          base_url="${DOKPLOY_BASE_URL%/}"
          short_sha="${GITHUB_SHA::12}"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            --request POST "$base_url/api/compose.redeploy" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"composeId\":\"$DOKPLOY_HUB_COMPOSE_ID\",\"title\":\"GitHub Actions $short_sha\",\"description\":\"Redeploy tethon-hub after GHCR image publish.\"}"

  deploy-hostd:
    name: Trigger hostd redeploy
    runs-on: ubuntu-latest
    needs: [go-checks, detect-changes, publish-hostd-image]
    if: ${{ always() && github.event_name != 'pull_request' && needs.go-checks.result == 'success' && needs.detect-changes.result == 'success' && (needs.detect-changes.outputs.hostd_image_changed == 'true' || needs.detect-changes.outputs.hostd_deploy_changed == 'true') && (needs.publish-hostd-image.result == 'success' || needs.publish-hostd-image.result == 'skipped') }}
    steps:
      - name: Trigger hostd redeploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_BASE_URL: ${{ vars.DOKPLOY_BASE_URL }}
          DOKPLOY_HOSTD_COMPOSE_ID: ${{ vars.DOKPLOY_HOSTD_COMPOSE_ID }}
        run: |
          missing=0
          if [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_BASE_URL" ] || [ -z "$DOKPLOY_HOSTD_COMPOSE_ID" ]; then
            [ -n "$DOKPLOY_API_KEY" ] || { echo "::error::DOKPLOY_API_KEY secret is missing."; missing=1; }
            [ -n "$DOKPLOY_BASE_URL" ] || { echo "::error::DOKPLOY_BASE_URL repository variable is missing."; missing=1; }
            [ -n "$DOKPLOY_HOSTD_COMPOSE_ID" ] || { echo "::error::DOKPLOY_HOSTD_COMPOSE_ID repository variable is missing."; missing=1; }
            exit "$missing"
          fi
          base_url="${DOKPLOY_BASE_URL%/}"
          short_sha="${GITHUB_SHA::12}"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            --request POST "$base_url/api/compose.redeploy" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"composeId\":\"$DOKPLOY_HOSTD_COMPOSE_ID\",\"title\":\"GitHub Actions $short_sha\",\"description\":\"Redeploy tethon-hostd after GHCR image publish.\"}"
